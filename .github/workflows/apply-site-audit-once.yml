name: Apply site audit once

on:
  push:
    branches: [audit-layout-and-localization]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-layout-and-localization
      - name: Apply copy and layout audit
        run: python tools/site_copy_audit_once.py --apply
      - name: Verify audited site
        run: |
          python tools/site_copy_audit_once.py --check
          python tools/verify_public_naming.py --post-rename
          git diff --check
      - name: Remove one-shot audit tooling
        run: |
          rm tools/site_copy_audit_once.py
          rm .github/workflows/apply-site-audit-once.yml
      - name: Commit audited site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site tools/verify_public_naming.py .github/workflows/apply-site-audit-once.yml tools/site_copy_audit_once.py
          git commit -m "site: polish layout and native-language copy"
          git push origin HEAD:audit-layout-and-localization
