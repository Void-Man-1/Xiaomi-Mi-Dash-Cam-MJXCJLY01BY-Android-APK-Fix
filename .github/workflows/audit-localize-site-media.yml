name: Temporary same-origin media migration

on:
  push:
    branches:
      - audit/full-repository-2026-09-11
    paths:
      - '.github/workflows/audit-localize-site-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-repository-2026-09-11

      - name: Replace repository Raw media URLs with Pages paths
        shell: python
        run: |
          from pathlib import Path
          import re

          repo = 'Xiaomi-Mi-Dash-Cam-MJXCJLY01BY-Android-APK-Fix'
          raw = f'https://raw.githubusercontent.com/Void-Man-1/{repo}/main/assets/'
          pages = [
              Path('site/index.html'), Path('site/pl/index.html'), Path('site/uk/index.html'),
              Path('site/de/index.html'), Path('site/ru/index.html'),
          ]

          used_screenshots = set()
          for path in pages:
              text = path.read_text(encoding='utf-8')
              prefix = '' if path == Path('site/index.html') else '../'

              text = text.replace(raw + 'app-icon.png', prefix + 'media/app-icon.png')

              def screenshot(match):
                  name = match.group(1)
                  used_screenshots.add(name)
                  return prefix + 'media/screenshots/' + name
              text = re.sub(re.escape(raw + 'screenshots/') + r'([^"?#]+)', screenshot, text)

              def evidence(match):
                  return prefix + 'media/' + match.group(1)
              text = re.sub(re.escape(raw + 'evidence/') + r'([^"?#]+)', evidence, text)

              if raw in text:
                  raise SystemExit(f'{path}: unconverted repository Raw asset remains')
              path.write_text(text, encoding='utf-8')

          allowed = {
              'poco-f6-v2.0.0-main.png',
              'offline-account-redmi-android16.png',
              'galaxy-s24-ultra-android14-add-camera.png',
          }
          unexpected = used_screenshots - allowed
          if unexpected:
              raise SystemExit('Deploy workflow must explicitly stage newly referenced screenshots: ' + ', '.join(sorted(unexpected)))
          print('SAME_ORIGIN_SCREENSHOTS=' + ','.join(sorted(used_screenshots)))

      - name: Verify durable same-origin contract
        run: python tools/verify_repository_integrity.py

      - name: Commit migrated pages
        shell: bash
        run: |
          set -euo pipefail
          tracked=(site/index.html site/pl/index.html site/uk/index.html site/de/index.html site/ru/index.html)
          if git diff --quiet -- "${tracked[@]}"; then
            echo 'Site media is already same-origin.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${tracked[@]}"
          git commit -m 'fix: serve repository media from Pages origin'
          git push origin HEAD:audit/full-repository-2026-09-11
