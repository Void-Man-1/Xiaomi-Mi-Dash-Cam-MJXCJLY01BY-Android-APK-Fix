name: Link troubleshooting guide once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-troubleshooting-once.yml'
      - 'tools/link_troubleshooting_once.py'

permissions:
  contents: write

jobs:
  link-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add troubleshooting links
        run: python tools/link_troubleshooting_once.py
      - name: Commit README change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already links the troubleshooting guide."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: link troubleshooting guide from README"
          git push
