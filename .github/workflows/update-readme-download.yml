name: Update README download

on:
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-readme-download.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-release-download
  cancel-in-progress: true

jobs:
  update-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Find canonical APK in latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
          tag="$(jq -r '.tag_name' <<<"$release_json")"
          version="${tag#v}"
          expected_name="Mi-Dash-Cam-${version}.apk"
          apk_name="$(jq -r --arg expected "$expected_name" '[.assets[] | select(.name == $expected)][0].name // empty' <<<"$release_json")"
          apk_url="$(jq -r --arg expected "$expected_name" '[.assets[] | select(.name == $expected)][0].browser_download_url // empty' <<<"$release_json")"

          if [[ -z "$apk_name" || -z "$apk_url" ]]; then
            echo "Canonical APK $expected_name not found in latest release: $tag" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "apk_name=$apk_name"
            echo "apk_url=$apk_url"
          } >> "$GITHUB_OUTPUT"

      - name: Update canonical download links
        env:
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          APK_URL: ${{ steps.release.outputs.apk_url }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          apk_name = os.environ['APK_NAME']
          apk_url = os.environ['APK_URL']
          tag = os.environ['RELEASE_TAG']
          version = tag[1:] if tag.startswith('v') else tag

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')

          banner = f'''<!-- latest-apk-download:start -->
          <p align="center">
            <a href="{apk_url}">
              <img src="https://img.shields.io/badge/Download-Latest%20APK-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Download latest Mi Dash Cam APK">
            </a>
          </p>

          <p align="center">
            <strong>Latest release:</strong> <code>{apk_name}</code><br>
            Download directly on Android, or on a PC to transfer to your phone.
          </p>
          <!-- latest-apk-download:end -->'''

          banner = '\n'.join(line.lstrip() if line.startswith('          ') else line for line in banner.splitlines())
          pattern = re.compile(
              r'<!-- latest-apk-download:start -->.*?<!-- latest-apk-download:end -->',
              re.DOTALL,
          )
          if not pattern.search(text):
              raise SystemExit('README download marker block not found')
          readme.write_text(pattern.sub(banner, text, count=1), encoding='utf-8')

          localized = [
              (Path('docs/README.pl.md'), lambda name: f'Pobierz {name}'),
              (Path('docs/README.uk.md'), lambda name: f'Завантажити {name}'),
              (Path('docs/README.de.md'), lambda name: f'{name} herunterladen'),
              (Path('docs/README.ru.md'), lambda name: f'Скачать {name}'),
          ]
          link_pattern = re.compile(
              r'\*\*\[[^\]]*\.apk[^\]]*\]\(https://github\.com/[^\)]+\.apk\)\*\*'
          )
          for path, label_for in localized:
              if not path.exists():
                  continue
              body = path.read_text(encoding='utf-8')
              replacement = f'**[{label_for(apk_name)}]({apk_url})**'
              if link_pattern.search(body):
                  body = link_pattern.sub(replacement, body, count=1)
              else:
                  raise SystemExit(f'Canonical APK link not found in {path}')
              path.write_text(body, encoding='utf-8')

          site_pages = [
              (Path('site/index.html'), lambda name: f'Download {name}'),
              (Path('site/pl/index.html'), lambda name: f'Pobierz {name}'),
              (Path('site/uk/index.html'), lambda name: f'Завантажити {name}'),
              (Path('site/de/index.html'), lambda name: f'{name} herunterladen'),
              (Path('site/ru/index.html'), lambda name: f'Скачать {name}'),
          ]
          site_pattern = re.compile(
              r'<!-- latest-apk-site:start -->.*?<!-- latest-apk-site:end -->',
              re.DOTALL,
          )
          for site, label_for in site_pages:
              if not site.exists():
                  continue
              body = site.read_text(encoding='utf-8')
              button = f'<!-- latest-apk-site:start --><a class="btn primary" href="{apk_url}">{label_for(apk_name)}</a><!-- latest-apk-site:end -->'
              if not site_pattern.search(body):
                  raise SystemExit(f'Site APK marker block not found in {site}')
              # A page may intentionally repeat the canonical CTA (hero + download panel).
              body = site_pattern.sub(button, body)
              body = re.sub(r'"softwareVersion":\s*"[^"]+"', f'"softwareVersion": "{version}"', body, count=1)
              body = re.sub(r'"downloadUrl":\s*"[^"]+"', f'"downloadUrl": "{apk_url}"', body, count=1)
              body = re.sub(
                  r'"releaseNotes":\s*"[^"]+"',
                  f'"releaseNotes": "https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/tag/{tag}"',
                  body,
                  count=1,
              )
              site.write_text(body, encoding='utf-8')

      - name: Commit download-link changes
        shell: bash
        run: |
          set -euo pipefail
          tracked=(
            README.md
            docs/README.pl.md
            docs/README.uk.md
            docs/README.de.md
            docs/README.ru.md
            site/index.html
            site/pl/index.html
            site/uk/index.html
            site/de/index.html
            site/ru/index.html
          )
          if git diff --quiet -- "${tracked[@]}"; then
            echo "All download links and site metadata already point to the canonical latest-release APK."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${tracked[@]}"
          git commit -m "docs: sync canonical release APK links and site metadata"
          git push
