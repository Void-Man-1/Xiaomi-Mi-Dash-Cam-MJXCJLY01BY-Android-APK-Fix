name: Final responsive breakpoint once

on:
  push:
    branches: [audit-layout-and-localization]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-layout-and-localization
      - name: Move content-driven navigation breakpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/styles.css')
          s = p.read_text(encoding='utf-8')
          old = '@media(max-width:1100px){.nav-links{display:none}}'
          new = '@media(max-width:1240px){.nav-links{display:none}}'
          if old not in s:
              raise SystemExit('Expected 1100px breakpoint not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F '@media(max-width:1240px){.nav-links{display:none}}' site/styles.css
          git diff --check
          python tools/verify_public_naming.py --post-rename
      - name: Remove one-shot workflow
        run: rm .github/workflows/final-responsive-breakpoint-once.yml
      - name: Commit final responsive fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "site: avoid localized header collisions"
          git push origin HEAD:audit-layout-and-localization
