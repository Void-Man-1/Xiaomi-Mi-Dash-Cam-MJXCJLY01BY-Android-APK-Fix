name: Temporary social preview metadata updater

on:
  push:
    branches:
      - audit/full-repository-2026-09-11
    paths:
      - '.github/workflows/audit-apply-preview-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-repository-2026-09-11

      - name: Replace social preview metadata on all locales
        shell: python
        run: |
          from pathlib import Path
          import re

          canonical = 'https://void-man-1.github.io/Xiaomi-Mi-Dash-Cam-MJXCJLY01BY-Android-APK-Fix/social-preview.png'
          pages = [
              Path('site/index.html'), Path('site/pl/index.html'), Path('site/uk/index.html'),
              Path('site/de/index.html'), Path('site/ru/index.html'),
          ]
          for path in pages:
              text = path.read_text(encoding='utf-8')
              text, n1 = re.subn(r'<meta property="og:image" content="[^"]+">', f'<meta property="og:image" content="{canonical}">', text, count=1)
              text, n2 = re.subn(r'<meta name="twitter:image" content="[^"]+">', f'<meta name="twitter:image" content="{canonical}">', text, count=1)
              if n1 != 1 or n2 != 1:
                  raise SystemExit(f'{path}: expected one og:image and one twitter:image tag')
              if 'property="og:image:width"' not in text:
                  text = text.replace(
                      f'<meta property="og:image" content="{canonical}">',
                      f'<meta property="og:image" content="{canonical}">\n  <meta property="og:image:width" content="1200">\n  <meta property="og:image:height" content="630">',
                      1,
                  )
              else:
                  text = re.sub(r'<meta property="og:image:width" content="[^"]+">', '<meta property="og:image:width" content="1200">', text, count=1)
                  text = re.sub(r'<meta property="og:image:height" content="[^"]+">', '<meta property="og:image:height" content="630">', text, count=1)
              path.write_text(text, encoding='utf-8')

      - name: Verify metadata contract
        run: python tools/verify_repository_integrity.py

      - name: Commit metadata update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/index.html site/pl/index.html site/uk/index.html site/de/index.html site/ru/index.html; then
            echo 'Metadata already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/pl/index.html site/uk/index.html site/de/index.html site/ru/index.html
          git commit -m 'site: use dedicated social preview metadata'
          git push origin HEAD:audit/full-repository-2026-09-11
