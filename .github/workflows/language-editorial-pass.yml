name: Temporary final clean-tree language verification
# execution: 13

on:
  push:
    branches:
      - language/full-editorial-pass-2026-09-11
    paths:
      - '.github/workflows/language-editorial-pass.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: language/full-editorial-pass-2026-09-11
          fetch-depth: 0

      - name: Remove all temporary editorial tooling from working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/language-editorial-pass.yml
          rm -f tools/_language_edit_helpers.py
          rm -f tools/_language_editorial_pass.py
          rm -f tools/_language_edits_en.py
          rm -f tools/_language_edits_pl.py
          rm -f tools/_language_edits_uk.py
          rm -f tools/_language_edits_de.py
          rm -f tools/_language_edits_ru.py
          rm -f tools/_language_edits_docs.py
          rm -f tools/_language_second_pass.py
          rm -f tools/_language_layout_fix.py

      - name: Prove README files were not changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          bad="$(printf '%s\n' "$changed" | grep -E '(^|/)README($|\.)' || true)"
          test -z "$bad" || { echo "README changes detected: $bad" >&2; exit 1; }
          echo "README_UNCHANGED_FROM_MERGE_BASE=$base"

      - name: Run permanent repository validators
        run: |
          python tools/verify_public_naming.py --post-rename
          python tools/verify_repository_integrity.py

      - name: Verify language and factual invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re
          pages={'en':Path('site/index.html'),'pl':Path('site/pl/index.html'),'uk':Path('site/uk/index.html'),'de':Path('site/de/index.html'),'ru':Path('site/ru/index.html')}
          apk='https://github.com/Void-Man-1/Xiaomi-Mi-Dash-Cam-MJXCJLY01BY-Android-APK-Fix/releases/download/v2.0.0/Mi-Dash-Cam-2.0.0.apk'
          digest='2F189C0D3A6C9965036EDDBFA927EB7FD720C47D611991EB5EC1D1055E89B887'
          hreflangs={'en','pl','uk','de','ru','x-default'}
          for locale,path in pages.items():
              text=path.read_text(encoding='utf-8')
              assert f'<html lang="{locale}">' in text
              assert 'MJXCJLY01BY' in text and 'MJXCJLY02BY' in text
              assert 'Android 8.1 / 9 / 12–16' in text
              assert apk in text and digest in text
              assert 'flags/ru.svg' not in text
              assert text.rfind('lang="ru"') > text.rfind('lang="de"')
              assert hreflangs.issubset(set(re.findall(r'hreflang="([^"]+)"', text)))
              blocks=re.findall(r'<script type="application/ld\+json">(.*?)</script>', text, re.S)
              assert blocks
              for block in blocks: json.loads(block)
          en=pages['en'].read_text(encoding='utf-8').lower()
          pl=pages['pl'].read_text(encoding='utf-8').lower()
          uk=pages['uk'].read_text(encoding='utf-8').lower()
          de=pages['de'].read_text(encoding='utf-8')
          ru=pages['ru'].read_text(encoding='utf-8').lower()
          assert 'compatibility apk for the european' not in en
          assert 'physical-camera acceptance' not in en
          assert 'projekt zgodności' not in pl and 'fizyczną kamerą' not in pl
          assert 'фізичною камерою' not in uk and 'фізична камера' not in uk
          assert 'Kompatibilitätskorrekturen für aktuelle Android-Versionen.' not in de
          assert 'Korrekturen für aktuelle Android-Versionen.' in de
          assert 'физической камерой' not in ru and 'физическая камера' not in ru
          listing=Path('docs/GITHUB_LISTING.md').read_text(encoding='utf-8')
          assert 'Updated Android app for Xiaomi Mi Dash Cam MJXCJLY01BY EU.' in listing
          assert 'Android 8.1, 9 and 12–16' in listing
          print('LANGUAGE_AND_FACTUAL_INVARIANTS_OK')
          PY

      - name: Install browser smoke dependency
        run: |
          google-chrome --version
          python -m pip install --quiet --disable-pip-version-check selenium

      - name: Browser smoke clean tree
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory site >/tmp/site-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          paths={'en':'/','pl':'/pl/','uk':'/uk/','de':'/de/','ru':'/ru/'}
          viewports=[(360,900),(390,844),(768,1024),(1440,1000)]
          options=Options(); options.add_argument('--headless=new'); options.add_argument('--no-sandbox'); options.add_argument('--disable-dev-shm-usage')
          driver=webdriver.Chrome(options=options); failures=[]
          try:
              for locale,path in paths.items():
                  for width,height in viewports:
                      driver.set_window_size(width,height); driver.get('http://127.0.0.1:8765'+path); time.sleep(0.1)
                      driver.execute_script("document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'))")
                      m=driver.execute_script('''
                        const root=document.documentElement;
                        const sels=['.site-header','.hero .wrap','.trust-grid','.model-panel','.features','.evidence-video','.gallery','.steps','.download-card','.faq','.footer .wrap'];
                        const bounds=[];
                        for(const s of sels) for(const el of document.querySelectorAll(s)){const r=el.getBoundingClientRect();if(r.width<=0||r.height<=0)bounds.push(s+':zero-size');if(r.left < -2 || r.right > window.innerWidth+2)bounds.push(s+':horizontal-overflow');}
                        return {lang:root.lang,title:document.title,innerWidth:window.innerWidth,scrollWidth:root.scrollWidth,bounds,active:!!document.querySelector('.lang.active')};
                      ''')
                      print(locale,width,height,m)
                      if m['lang']!=locale: failures.append((locale,width,'lang'))
                      if not m['title']: failures.append((locale,width,'title'))
                      if m['scrollWidth']>m['innerWidth']+2: failures.append((locale,width,'overflow',m['scrollWidth'],m['innerWidth']))
                      if m['bounds']: failures.append((locale,width,'bounds',m['bounds']))
                      if not m['active']: failures.append((locale,width,'active-language'))
          finally: driver.quit()
          if failures: raise SystemExit('BROWSER_SMOKE_FAILURES='+repr(failures))
          print('BROWSER_SMOKE_OK')
          PY

      - name: Commit temporary-tool cleanup
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          bad="$(git diff --name-only "$base" HEAD | grep -E '(^|/)README($|\.)' || true)"
          test -z "$bad" || { echo "README changes detected: $bad" >&2; exit 1; }
          git config user.name 'Void__Man'
          git config user.email '49790372+Void-Man-1@users.noreply.github.com'
          git add -A .github/workflows/language-editorial-pass.yml tools/_language_edit_helpers.py tools/_language_editorial_pass.py tools/_language_edits_en.py tools/_language_edits_pl.py tools/_language_edits_uk.py tools/_language_edits_de.py tools/_language_edits_ru.py tools/_language_edits_docs.py tools/_language_second_pass.py tools/_language_layout_fix.py
          git diff --cached --check
          git diff --cached --name-status
          git commit -m 'chore: remove temporary language audit tooling'
          git push origin HEAD:language/full-editorial-pass-2026-09-11
