name: Temporary German layout diagnostics
# execution: 11

on:
  push:
    branches:
      - language/full-editorial-pass-2026-09-11
    paths:
      - '.github/workflows/language-editorial-pass.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: language/full-editorial-pass-2026-09-11
      - name: Install browser diagnostic dependency
        run: |
          google-chrome --version
          python -m pip install --quiet --disable-pip-version-check selenium
      - name: Diagnose 360px German overflow
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory site >/tmp/site-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          driver = webdriver.Chrome(options=options)
          try:
              driver.set_window_size(360, 900)
              driver.get('http://127.0.0.1:8765/de/')
              time.sleep(0.2)
              report = driver.execute_script('''
                const vw = window.innerWidth;
                const root = document.documentElement;
                const items = [...document.querySelectorAll('body *')].map((el, i) => {
                  const r = el.getBoundingClientRect();
                  const s = getComputedStyle(el);
                  return {
                    i,
                    tag: el.tagName,
                    id: el.id || '',
                    cls: typeof el.className === 'string' ? el.className : '',
                    text: (el.textContent || '').trim().replace(/\\s+/g,' ').slice(0,140),
                    left: Math.round(r.left), right: Math.round(r.right), width: Math.round(r.width),
                    scrollWidth: el.scrollWidth, clientWidth: el.clientWidth,
                    display: s.display, position: s.position, whiteSpace: s.whiteSpace,
                    overflowX: s.overflowX, minWidth: s.minWidth, maxWidth: s.maxWidth,
                    wordBreak: s.wordBreak, overflowWrap: s.overflowWrap
                  };
                });
                return {
                  viewport: vw,
                  rootClientWidth: root.clientWidth,
                  rootScrollWidth: root.scrollWidth,
                  bodyClientWidth: document.body.clientWidth,
                  bodyScrollWidth: document.body.scrollWidth,
                  widestScroll: items.filter(x => x.scrollWidth > x.clientWidth + 2).sort((a,b)=>b.scrollWidth-a.scrollWidth).slice(0,30),
                  beyondRight: items.filter(x => x.position !== 'absolute' && x.right > vw + 2).sort((a,b)=>b.right-a.right).slice(0,30),
                  wideRects: items.filter(x => x.width > vw + 2).sort((a,b)=>b.width-a.width).slice(0,30)
                };
              ''')
              print(json.dumps(report, ensure_ascii=False, indent=2))
              if report['rootScrollWidth'] <= report['viewport'] + 2:
                  raise SystemExit('Expected German overflow was not reproduced')
          finally:
              driver.quit()
          PY
