name: Temporary language editorial pass
# execution: 6

on:
  push:
    branches:
      - language/full-editorial-pass-2026-09-11
    paths:
      - '.github/workflows/language-editorial-pass.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: language/full-editorial-pass-2026-09-11
          fetch-depth: 0
      - name: Apply second editorial pass
        run: python tools/_language_second_pass.py
      - name: Refuse README changes
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git diff --name-only | awk -F/ '$NF == "README.md" || $NF ~ /^README\..*\.md$/ {print}')"
          if [ -n "$bad" ]; then
            echo "README changes are forbidden:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: Validate repository invariants before commit
        run: |
          python tools/verify_public_naming.py
          python tools/verify_repository_integrity.py
      - name: Commit editorial changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Void__Man'
          git config user.email '49790372+Void-Man-1@users.noreply.github.com'
          git add site docs/GITHUB_LISTING.md
          if git diff --cached --quiet; then
            echo 'No second-pass changes produced' >&2
            exit 1
          fi
          bad="$(git diff --cached --name-only | awk -F/ '$NF == "README.md" || $NF ~ /^README\..*\.md$/ {print}')"
          test -z "$bad" || { echo "README changes staged unexpectedly: $bad" >&2; exit 1; }
          git commit -m 'docs: refine localized project copy'
          git push origin HEAD:language/full-editorial-pass-2026-09-11
