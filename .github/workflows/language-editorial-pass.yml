name: Temporary German layout fix
# execution: 12

on:
  push:
    branches:
      - language/full-editorial-pass-2026-09-11
    paths:
      - '.github/workflows/language-editorial-pass.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: language/full-editorial-pass-2026-09-11
          fetch-depth: 0
      - name: Apply confirmed German heading fix
        run: python tools/_language_layout_fix.py
      - name: Prove README files were not changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          bad="$(git diff --name-only "$base" HEAD | grep -E '(^|/)README($|\.)' || true)"
          test -z "$bad" || { echo "README changes detected: $bad" >&2; exit 1; }
          bad_worktree="$(git diff --name-only | grep -E '(^|/)README($|\.)' || true)"
          test -z "$bad_worktree" || { echo "README worktree changes detected: $bad_worktree" >&2; exit 1; }
      - name: Run permanent validators
        run: |
          python tools/verify_public_naming.py --post-rename
          python tools/verify_repository_integrity.py
      - name: Install browser smoke dependency
        run: |
          google-chrome --version
          python -m pip install --quiet --disable-pip-version-check selenium
      - name: Browser smoke all locales and viewports
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory site >/tmp/site-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          paths = {'en': '/', 'pl': '/pl/', 'uk': '/uk/', 'de': '/de/', 'ru': '/ru/'}
          viewports = [(360, 900), (390, 844), (768, 1024), (1440, 1000)]
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          driver = webdriver.Chrome(options=options)
          failures = []
          try:
              for locale, path in paths.items():
                  for width, height in viewports:
                      driver.set_window_size(width, height)
                      driver.get('http://127.0.0.1:8765' + path)
                      time.sleep(0.1)
                      driver.execute_script("document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'))")
                      metrics = driver.execute_script('''
                        const root = document.documentElement;
                        const selectors = ['.site-header','.hero .wrap','.trust-grid','.model-panel','.features','.evidence-video','.gallery','.steps','.download-card','.faq','.footer .wrap'];
                        const bounds=[];
                        for (const selector of selectors) for (const el of document.querySelectorAll(selector)) {
                          const r=el.getBoundingClientRect();
                          if (r.width<=0 || r.height<=0) bounds.push(selector+':zero-size');
                          if (r.left < -2 || r.right > window.innerWidth + 2) bounds.push(selector+':horizontal-overflow');
                        }
                        return {lang:document.documentElement.lang,title:document.title,innerWidth:window.innerWidth,scrollWidth:root.scrollWidth,bounds,active:!!document.querySelector('.lang.active')};
                      ''')
                      print(locale, width, height, metrics)
                      if metrics['lang'] != locale: failures.append((locale,width,'lang'))
                      if not metrics['title']: failures.append((locale,width,'title'))
                      if metrics['scrollWidth'] > metrics['innerWidth'] + 2: failures.append((locale,width,'page-overflow',metrics['scrollWidth'],metrics['innerWidth']))
                      if metrics['bounds']: failures.append((locale,width,'bounds',metrics['bounds']))
                      if not metrics['active']: failures.append((locale,width,'active-language'))
          finally:
              driver.quit()
          if failures:
              raise SystemExit('BROWSER_SMOKE_FAILURES=' + repr(failures))
          print('BROWSER_SMOKE_OK')
          PY
      - name: Commit German layout fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Void__Man'
          git config user.email '49790372+Void-Man-1@users.noreply.github.com'
          git add site/de/index.html
          git diff --cached --check
          git commit -m 'site: fix German mobile heading overflow'
          git push origin HEAD:language/full-editorial-pass-2026-09-11
