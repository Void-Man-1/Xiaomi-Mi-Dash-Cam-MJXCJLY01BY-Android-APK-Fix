name: Temporary social preview generator

on:
  push:
    branches:
      - audit/full-repository-2026-09-11
    paths:
      - '.github/workflows/audit-generate-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-repository-2026-09-11

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate 1200x630 social card
        shell: python
        run: |
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          W, H = 1200, 630
          bg=(246,246,243); ink=(22,22,22); muted=(92,92,88); orange=(255,105,0)
          panel=(27,27,27); white=(250,250,248); green=(50,150,95)
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          mono='/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf'
          img=Image.new('RGB',(W,H),bg); d=ImageDraw.Draw(img)
          fs=ImageFont.truetype(bold,22); fk=ImageFont.truetype(bold,24)
          ft=ImageFont.truetype(bold,72); fm=ImageFont.truetype(mono,37)
          fsub=ImageFont.truetype(reg,32); fbadge=ImageFont.truetype(bold,22)
          ftiny=ImageFont.truetype(reg,19)

          d.rounded_rectangle((56,50,98,58),4,fill=orange)
          d.text((114,40),'INDEPENDENT COMPATIBILITY PROJECT',font=fk,fill=muted)
          d.text((56,105),'Mi Dash Cam',font=ft,fill=ink)
          d.text((56,195),'MJXCJLY01BY',font=fm,fill=orange)
          d.text((56,252),'Android compatibility fix',font=fsub,fill=ink)
          d.text((56,313),'Keep the original EU dash cam working',font=fs,fill=muted)
          d.text((56,346),'on current Android and HyperOS.',font=fs,fill=muted)

          def pill(x,y,text):
              box=d.textbbox((0,0),text,font=fbadge); tw=box[2]-box[0]; th=box[3]-box[1]
              rect=(x,y,x+tw+34,y+th+20)
              d.rounded_rectangle(rect,16,fill=(235,235,230),outline=(218,218,212),width=1)
              d.text((x+17,y+8),text,font=fbadge,fill=ink)
              return rect[2]

          x=pill(56,409,'Android 8.1 / 9 / 12–16')+14
          pill(x,409,'HyperOS')
          d.ellipse((58,501,72,515),fill=green)
          d.text((84,493),'Hardware-tested · v2.0.0',font=fs,fill=ink)
          d.text((56,539),'Local Wi-Fi · live preview · recordings · downloads',font=ftiny,fill=muted)

          d.rounded_rectangle((760,40,1140,590),28,fill=panel)
          d.rounded_rectangle((918,86,982,125),10,fill=(60,60,60))
          d.rounded_rectangle((900,112,1000,133),8,fill=(74,74,74))
          d.rounded_rectangle((838,125,1062,222),22,fill=(54,54,54),outline=(95,95,95),width=2)
          d.ellipse((867,143,931,207),fill=(18,18,18),outline=(130,130,130),width=3)
          d.ellipse((879,155,919,195),fill=(38,45,50)); d.ellipse((889,165,908,184),fill=(88,103,110))
          d.ellipse((1025,157,1039,171),fill=orange)
          d.text((955,160),'MI DASH',font=ImageFont.truetype(bold,16),fill=(210,210,205))

          d.rounded_rectangle((858,257,1042,536),28,fill=(9,9,9),outline=(85,85,85),width=2)
          d.rounded_rectangle((870,274,1030,515),18,fill=(244,244,239))
          d.rounded_rectangle((870,274,1030,326),18,fill=orange); d.rectangle((870,303,1030,326),fill=orange)
          d.text((888,288),'Mi Dash Cam',font=ImageFont.truetype(bold,17),fill=white)
          d.rounded_rectangle((886,344,1014,429),10,fill=(47,52,55))
          d.polygon([(886,405),(944,373),(1014,398),(1014,429),(886,429)],fill=(78,82,81))
          d.line((950,385,950,429),fill=(210,210,200),width=3)
          for xx in (902,950,998): d.ellipse((xx-10,451,xx+10,471),fill=(220,220,214))
          d.rounded_rectangle((800,523,1100,570),16,fill=(241,241,236))
          d.text((819,534),'✓  Android 16 / HyperOS 3',font=ImageFont.truetype(bold,18),fill=ink)
          d.rounded_rectangle((18,18,W-18,H-18),20,outline=(231,231,225),width=2)

          out=Path('site/social-preview.png')
          img.save(out,optimize=True)
          check=Image.open(out)
          if check.size != (1200,630): raise SystemExit(f'Unexpected preview size: {check.size}')
          print(f'WROTE={out} SIZE={check.size}')

      - name: Commit generated asset
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/social-preview.png && git ls-files --error-unmatch site/social-preview.png >/dev/null 2>&1; then
            echo 'Social preview already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/social-preview.png
          git commit -m 'site: add dedicated social preview card'
          git push origin HEAD:audit/full-repository-2026-09-11
