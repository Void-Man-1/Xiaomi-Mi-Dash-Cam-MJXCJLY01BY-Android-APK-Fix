name: Add website languages once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-web-languages-once.yml'
      - 'tools/add_web_languages_once.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply website and README patch
        run: python tools/add_web_languages_once.py
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md site/index.html site/sitemap.xml .github/workflows/update-readme-download.yml; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md site/index.html site/sitemap.xml .github/workflows/update-readme-download.yml
          git commit -m "docs: add website CTA and EN RU PL site navigation"
          git push
