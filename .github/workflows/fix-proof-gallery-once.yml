name: Fix proof gallery once

on:
  push:
    branches: [fix-proof-gallery-video]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-proof-gallery-video
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild proof media section
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          video_raw = "https://raw.githubusercontent.com/Void-Man-1/Xiaomi-Mi-Dash-Cam-MJXCJLY01BY-Android-APK-Fix/main/assets/evidence/poco-f6-android16-v2.0.0-full-camera-test.mp4"
          poster_raw = "https://raw.githubusercontent.com/Void-Man-1/Xiaomi-Mi-Dash-Cam-MJXCJLY01BY-Android-APK-Fix/main/assets/evidence/poco-f6-android16-v2.0.0-video-poster.jpg"
          video_github = "https://github.com/Void-Man-1/Xiaomi-Mi-Dash-Cam-MJXCJLY01BY-Android-APK-Fix/blob/main/assets/evidence/poco-f6-android16-v2.0.0-full-camera-test.mp4"

          copy = {
              "site/index.html": {
                  "title": "Full physical-camera acceptance test",
                  "note": "Poco F6 · Android 16 / HyperOS 3 · physical MJXCJLY01BY EU camera",
                  "aria": "Full physical-camera acceptance test video",
                  "fallback": "Your browser cannot play this MP4. Open the original video on GitHub.",
                  "open": "Open original video →",
              },
              "site/pl/index.html": {
                  "title": "Pełny test z fizyczną kamerą",
                  "note": "Poco F6 · Android 16 / HyperOS 3 · fizyczna kamera MJXCJLY01BY EU",
                  "aria": "Film z pełnego testu z fizyczną kamerą",
                  "fallback": "Twoja przeglądarka nie może odtworzyć tego pliku MP4. Otwórz oryginalne nagranie na GitHubie.",
                  "open": "Otwórz oryginalne nagranie →",
              },
              "site/uk/index.html": {
                  "title": "Повний тест із фізичною камерою",
                  "note": "Poco F6 · Android 16 / HyperOS 3 · фізична камера MJXCJLY01BY EU",
                  "aria": "Відео повного тесту з фізичною камерою",
                  "fallback": "Ваш браузер не може відтворити цей MP4-файл. Відкрийте оригінальне відео на GitHub.",
                  "open": "Відкрити оригінальне відео →",
              },
              "site/de/index.html": {
                  "title": "Vollständiger Test mit echter Kamera",
                  "note": "Poco F6 · Android 16 / HyperOS 3 · physische MJXCJLY01BY-EU-Kamera",
                  "aria": "Video des vollständigen Tests mit echter Kamera",
                  "fallback": "Ihr Browser kann diese MP4-Datei nicht abspielen. Öffnen Sie das Originalvideo auf GitHub.",
                  "open": "Originalvideo öffnen →",
              },
              "site/ru/index.html": {
                  "title": "Полный тест с реальной камерой",
                  "note": "Poco F6 · Android 16 / HyperOS 3 · физическая камера MJXCJLY01BY EU",
                  "aria": "Видео полного теста с реальной камерой",
                  "fallback": "Ваш браузер не может воспроизвести этот MP4-файл. Откройте оригинальное видео на GitHub.",
                  "open": "Открыть оригинальное видео →",
              },
          }

          for rel, c in copy.items():
              path = Path(rel)
              html = path.read_text(encoding="utf-8")
              proof = html.index('<section class="section proof-section">')
              gallery = html.index('<div class="gallery">', proof)
              if 'class="evidence-video"' in html[proof:gallery]:
                  raise SystemExit(f"{rel}: evidence video already present")

              block = f'''<figure class="evidence-video">
<div class="video-stage"><video controls playsinline preload="metadata" poster="{poster_raw}" aria-label="{c['aria']}"><source src="{video_raw}" type="video/mp4">{c['fallback']}</video></div>
<figcaption class="video-meta"><div><strong>{c['title']}</strong><span>{c['note']}</span></div><a href="{video_github}">{c['open']}</a></figcaption>
</figure>
'''
              html = html[:gallery] + block + html[gallery:]
              html, count = re.subn(r'<div class="evidence-bar">.*?</div>', '', html, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{rel}: expected one evidence bar, found {count}")
              path.write_text(html, encoding="utf-8")

          css_path = Path("site/styles.css")
          css = css_path.read_text(encoding="utf-8")
          old_pattern = re.compile(r'\.proof-section\{.*?\.evidence-bar a\{[^}]*\}', re.S)
          new_css = '''.proof-section{background:var(--dark);color:#fff}.proof-section .section-head p{color:#bcbcbc}.proof-section .kicker{color:#ffa76d}
.evidence-video{margin:0 0 18px;border:1px solid #333;border-radius:22px;background:#161616;overflow:hidden}.video-stage{display:grid;place-items:center;aspect-ratio:16/9;max-height:660px;background:#050505}.video-stage video{display:block;width:100%;height:100%;object-fit:contain;background:#050505}.video-meta{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 18px;border-top:1px solid #303030;background:#1b1b1b}.video-meta strong{display:block;font-size:.96rem}.video-meta span{display:block;margin-top:3px;color:#bdbdbd;font-size:.8rem}.video-meta a{flex:0 0 auto;color:#fff;font-weight:800}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.shot{margin:0;display:flex;min-width:0;min-height:0;flex-direction:column;border:1px solid #333;border-radius:20px;background:#171717;overflow:hidden}.shot img{display:block;width:100%;height:clamp(340px,38vw,520px);object-fit:contain;object-position:center top;background:#0b0b0b}.shot-caption{position:static;display:block;min-height:64px;padding:11px 13px;border-top:1px solid #303030;background:#1c1c1c}.shot-caption strong{display:block;font-size:.9rem}.shot-caption span{display:block;color:#c5c5c5;font-size:.77rem;margin-top:2px}'''
          css, count = old_pattern.subn(new_css, css, count=1)
          if count != 1:
              raise SystemExit(f"styles.css: proof media block replacement count={count}")

          css = css.replace('.features{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:1fr 1fr}.shot:first-child{grid-column:1/-1}.steps', '.features{grid-template-columns:1fr 1fr}.steps')
          css = css.replace('@media(max-width:820px){.nav{', '@media(max-width:820px){.gallery{grid-template-columns:1fr}.video-meta{align-items:flex-start;flex-direction:column}.nav{')
          css = css.replace('.shot,.shot:first-child{grid-column:auto;min-height:480px}', '.shot,.shot:first-child{grid-column:auto;min-height:0}.shot img{height:min(72vh,560px)}')
          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Static validation
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          pages = [Path('site/index.html'), Path('site/pl/index.html'), Path('site/uk/index.html'), Path('site/de/index.html'), Path('site/ru/index.html')]
          for p in pages:
              s = p.read_text(encoding='utf-8')
              assert s.count('class="evidence-video"') == 1, p
              assert s.count('<video controls playsinline preload="metadata"') == 1, p
              assert s.count('type="video/mp4"') == 1, p
              assert 'poco-f6-android16-v2.0.0-video-poster.jpg' in s, p
              assert 'poco-f6-android16-v2.0.0-full-camera-test.mp4' in s, p
              assert 'class="evidence-bar"' not in s, p
              assert s.count('class="shot"') == 3, p
          css = Path('site/styles.css').read_text(encoding='utf-8')
          assert 'grid-template-columns:repeat(3,minmax(0,1fr))' in css
          assert '.shot img' in css and 'object-fit:contain' in css
          assert '.shot:first-child{min-height:560px}' not in css
          print('STATIC VALIDATION OK')
          PY

      - name: Verify media assets are reachable
        run: |
          curl -L --fail --silent --show-error -r 0-4095 -o /tmp/video-head 'https://raw.githubusercontent.com/Void-Man-1/Xiaomi-Mi-Dash-Cam-MJXCJLY01BY-Android-APK-Fix/main/assets/evidence/poco-f6-android16-v2.0.0-full-camera-test.mp4'
          curl -L --fail --silent --show-error -o /tmp/poster.jpg 'https://raw.githubusercontent.com/Void-Man-1/Xiaomi-Mi-Dash-Cam-MJXCJLY01BY-Android-APK-Fix/main/assets/evidence/poco-f6-android16-v2.0.0-video-poster.jpg'
          test -s /tmp/video-head
          test -s /tmp/poster.jpg

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser geometry and video validation
        run: |
          python -m http.server 8000 --directory site >/tmp/site-http.log 2>&1 &
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const locales = ['/', '/pl/', '/uk/', '/de/', '/ru/'];
            const widths = [1440, 1024, 820, 680, 390];
            for (const locale of locales) {
              for (const width of widths) {
                await page.setViewportSize({width, height:1000});
                await page.goto(`http://127.0.0.1:8000${locale}`, {waitUntil:'domcontentloaded'});
                await page.locator('.proof-section').scrollIntoViewIfNeeded();
                const result = await page.evaluate(() => {
                  const video = document.querySelector('.evidence-video video');
                  const shots = [...document.querySelectorAll('.gallery .shot')];
                  const gallery = document.querySelector('.gallery');
                  return {
                    vw: document.documentElement.clientWidth,
                    sw: document.documentElement.scrollWidth,
                    videoCount: document.querySelectorAll('.evidence-video video').length,
                    controls: video?.controls,
                    source: video?.querySelector('source')?.src || '',
                    poster: video?.poster || '',
                    galleryColumns: getComputedStyle(gallery).gridTemplateColumns.split(' ').filter(Boolean).length,
                    shotWidths: shots.map(s => Math.round(s.getBoundingClientRect().width)),
                    imgFits: shots.map(s => getComputedStyle(s.querySelector('img')).objectFit),
                    captionPositions: shots.map(s => getComputedStyle(s.querySelector('.shot-caption')).position),
                  };
                });
                assert.ok(result.sw <= result.vw + 1, `${locale}@${width}: horizontal overflow`);
                assert.equal(result.videoCount, 1, `${locale}@${width}: video missing`);
                assert.equal(result.controls, true, `${locale}@${width}: video controls missing`);
                assert.ok(result.source.endsWith('poco-f6-android16-v2.0.0-full-camera-test.mp4'), `${locale}@${width}: wrong video source`);
                assert.ok(result.poster.endsWith('poco-f6-android16-v2.0.0-video-poster.jpg'), `${locale}@${width}: wrong poster`);
                const expectedCols = width <= 820 ? 1 : 3;
                assert.equal(result.galleryColumns, expectedCols, `${locale}@${width}: unexpected gallery columns`);
                assert.ok(Math.max(...result.shotWidths) - Math.min(...result.shotWidths) <= 1, `${locale}@${width}: unequal screenshot-card widths`);
                assert.ok(result.imgFits.every(v => v === 'contain'), `${locale}@${width}: screenshot cropping enabled`);
                assert.ok(result.captionPositions.every(v => v === 'static'), `${locale}@${width}: captions still overlay screenshots`);
                console.log(`${locale} ${width}px OK`);
              }
            }

            await page.setViewportSize({width:1440,height:1000});
            await page.goto('http://127.0.0.1:8000/', {waitUntil:'domcontentloaded'});
            const video = page.locator('.evidence-video video');
            await video.evaluate(v => new Promise((resolve, reject) => {
              if (v.readyState >= 1) return resolve();
              const timer = setTimeout(() => reject(new Error('video metadata timeout')), 15000);
              v.addEventListener('loadedmetadata', () => { clearTimeout(timer); resolve(); }, {once:true});
              v.addEventListener('error', () => { clearTimeout(timer); reject(new Error('video load error')); }, {once:true});
              v.load();
            }));
            const ready = await video.evaluate(v => ({readyState:v.readyState, duration:v.duration}));
            assert.ok(ready.readyState >= 1 && Number.isFinite(ready.duration) && ready.duration > 0, `video metadata invalid: ${JSON.stringify(ready)}`);
            console.log(`VIDEO METADATA OK: ${ready.duration.toFixed(2)}s`);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit verified site changes and remove one-shot workflow
        run: |
          rm .github/workflows/fix-proof-gallery-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'site: rebuild proof gallery and embed acceptance video'
          git push origin HEAD:fix-proof-gallery-video
