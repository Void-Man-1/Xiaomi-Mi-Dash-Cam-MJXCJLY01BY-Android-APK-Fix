name: Check proof gallery

on:
  push:
    branches:
      - fix-proof-gallery-video

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-proof-gallery-video
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python -m http.server 8000 --directory site >/tmp/site-http.log 2>&1 &
          sleep 1
      - name: Run browser audit
        run: node tools/check_proof_gallery.js
      - uses: actions/upload-artifact@v4
        with:
          name: proof-gallery-screenshots
          path: proof-audit/*.png
