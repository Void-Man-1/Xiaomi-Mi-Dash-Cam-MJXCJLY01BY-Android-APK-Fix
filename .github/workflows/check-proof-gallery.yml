name: Check proof gallery

on:
  push:
    branches:
      - fix-proof-gallery-video
    paths:
      - '.github/workflows/check-proof-gallery.yml'

permissions:
  contents: write

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-proof-gallery-video

      - name: Stage same-origin proof media
        run: |
          python <<'PY'
          from pathlib import Path

          mp4 = 'poco-f6-android16-v2.0.0-full-camera-test.mp4'
          poster = 'poco-f6-android16-v2.0.0-video-poster.jpg'
          raw_base = 'https://raw.githubusercontent.com/Void-Man-1/Xiaomi-Mi-Dash-Cam-MJXCJLY01BY-Android-APK-Fix/main/assets/evidence/'
          pages = [
              ('site/index.html', 'media/'),
              ('site/pl/index.html', '../media/'),
              ('site/uk/index.html', '../media/'),
              ('site/de/index.html', '../media/'),
              ('site/ru/index.html', '../media/'),
          ]
          for rel, prefix in pages:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              text = text.replace(raw_base + mp4, prefix + mp4)
              text = text.replace(raw_base + poster, prefix + poster)
              path.write_text(text, encoding='utf-8')
          PY
          mkdir -p site/media
          cp assets/evidence/poco-f6-android16-v2.0.0-full-camera-test.mp4 site/media/
          cp assets/evidence/poco-f6-android16-v2.0.0-video-poster.jpg site/media/

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright library outside the repository
        run: npm install --prefix /tmp/proof-pw --no-save playwright@1.55.0

      - name: Start site
        run: |
          python -m http.server 8000 --directory site >/tmp/site-http.log 2>&1 &
          sleep 1

      - name: Run browser audit in Google Chrome
        run: |
          sed -i "s/chromium.launch({ headless: true })/chromium.launch({ channel: 'chrome', headless: true })/" tools/check_proof_gallery.js
          NODE_PATH=/tmp/proof-pw/node_modules node tools/check_proof_gallery.js

      - uses: actions/upload-artifact@v4
        with:
          name: proof-gallery-screenshots
          path: proof-audit/*.png

      - name: Commit verified media references only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/pl/index.html site/uk/index.html site/de/index.html site/ru/index.html
          git commit -m 'site: use same-origin proof video media'
          git push origin HEAD:fix-proof-gallery-video
