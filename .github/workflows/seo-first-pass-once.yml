name: Apply SEO first pass once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-first-pass-once.yml'
      - 'tools/seo_first_pass.py'

permissions:
  contents: write

jobs:
  optimize-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve search and AI discoverability
        run: python tools/seo_first_pass.py

      - name: Commit discoverability changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md docs/README.ru.md docs/README.pl.md; then
            echo "No discoverability changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.ru.md docs/README.pl.md
          git commit -m "docs: improve search and AI discoverability"
          git push
