name: Temporary security audit follow-up

on:
  push:
    branches:
      - audit/full-repository-2026-09-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks with redacted machine-readable report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP:/audit" zricethezav/gitleaks:v8.24.3 detect \
            --source=/repo --no-banner --redact=100 --report-format=json --report-path=/audit/gitleaks.json --exit-code=0
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'gitleaks.json'
          findings = json.loads(path.read_text(encoding='utf-8')) if path.exists() else []
          print(f'GITLEAKS_FINDINGS={len(findings)}')
          for i, item in enumerate(findings, 1):
              safe = {
                  'RuleID': item.get('RuleID'),
                  'Description': item.get('Description'),
                  'File': item.get('File'),
                  'Commit': item.get('Commit'),
                  'StartLine': item.get('StartLine'),
                  'EndLine': item.get('EndLine'),
                  'Author': item.get('Author'),
                  'Date': item.get('Date'),
              }
              print(f'FINDING_{i}=' + json.dumps(safe, ensure_ascii=False))
          PY

      - name: Lint all GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
