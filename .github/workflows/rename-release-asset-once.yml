name: Rename v2.0.0 release asset once

on:
  push:
    branches: [migration/uniform-naming]
    paths:
      - '.github/workflows/rename-release-asset-once.yml'

permissions:
  contents: write

jobs:
  rename-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/uniform-naming

      - name: Rename accepted APK and synchronize release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag='v2.0.0'
          old_name='Mi-Dash-Cam-EU-2.0.0-android12-16-arm64.apk'
          new_name='Mi-Dash-Cam-2.0.0.apk'
          expected_size='30437934'
          expected_digest='sha256:2f189c0d3a6c9965036eddbfa927eb7fd720c47d611991eb5ec1d1055e89b887'

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          asset_id="$(jq -r --arg old "$old_name" --arg new "$new_name" '[.assets[] | select(.name == $old or .name == $new)][0].id // empty' <<<"$release_json")"
          asset_name="$(jq -r --arg old "$old_name" --arg new "$new_name" '[.assets[] | select(.name == $old or .name == $new)][0].name // empty' <<<"$release_json")"
          asset_size="$(jq -r --arg old "$old_name" --arg new "$new_name" '[.assets[] | select(.name == $old or .name == $new)][0].size // empty' <<<"$release_json")"
          asset_digest="$(jq -r --arg old "$old_name" --arg new "$new_name" '[.assets[] | select(.name == $old or .name == $new)][0].digest // empty' <<<"$release_json")"

          [[ -n "$asset_id" ]] || { echo 'Accepted APK asset not found' >&2; exit 1; }
          [[ "$asset_size" == "$expected_size" ]] || { echo "Unexpected APK size: $asset_size" >&2; exit 1; }
          [[ "$asset_digest" == "$expected_digest" ]] || { echo "Unexpected APK digest: $asset_digest" >&2; exit 1; }

          if [[ "$asset_name" == "$old_name" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" -f name="$new_name" >/dev/null
          elif [[ "$asset_name" != "$new_name" ]]; then
            echo "Unexpected APK name: $asset_name" >&2
            exit 1
          fi

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title 'Mi Dash Cam 2.0.0' --notes-file docs/RELEASE_NOTES_2.0.0.md

          final_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          final_name="$(jq -r --arg new "$new_name" '[.assets[] | select(.name == $new)][0].name // empty' <<<"$final_json")"
          final_size="$(jq -r --arg new "$new_name" '[.assets[] | select(.name == $new)][0].size // empty' <<<"$final_json")"
          final_digest="$(jq -r --arg new "$new_name" '[.assets[] | select(.name == $new)][0].digest // empty' <<<"$final_json")"
          final_title="$(jq -r '.name' <<<"$final_json")"
          old_count="$(jq -r --arg old "$old_name" '[.assets[] | select(.name == $old)] | length' <<<"$final_json")"

          [[ "$final_name" == "$new_name" ]] || { echo 'Canonical APK rename did not persist' >&2; exit 1; }
          [[ "$final_size" == "$expected_size" ]] || { echo "Final APK size changed: $final_size" >&2; exit 1; }
          [[ "$final_digest" == "$expected_digest" ]] || { echo "Final APK digest changed: $final_digest" >&2; exit 1; }
          [[ "$final_title" == 'Mi Dash Cam 2.0.0' ]] || { echo "Unexpected release title: $final_title" >&2; exit 1; }
          [[ "$old_count" == '0' ]] || { echo 'Legacy APK asset still present' >&2; exit 1; }

          echo "Verified: $final_name | $final_size bytes | $final_digest | $final_title"
