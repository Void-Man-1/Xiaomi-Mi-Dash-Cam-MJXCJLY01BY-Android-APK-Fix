name: Refine proof layout once

on:
  push:
    branches:
      - fix-proof-gallery-video
    paths:
      - '.github/workflows/refine-proof-layout-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-proof-gallery-video

      - name: Constrain portrait video player
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('site/styles.css')
          s = p.read_text(encoding='utf-8')
          old = '.video-stage{display:grid;place-items:center;aspect-ratio:16/9;max-height:660px;background:#050505}.video-stage video{display:block;width:100%;height:100%;object-fit:contain;background:#050505}'
          new = '.video-stage{display:grid;place-items:center;min-width:0;min-height:0;aspect-ratio:16/9;max-height:660px;overflow:hidden;background:#050505}.video-stage video{display:block;min-width:0;min-height:0;width:100%;height:100%;object-fit:contain;background:#050505}'
          if old not in s:
              raise SystemExit('desktop video-stage pattern not found')
          s = s.replace(old, new, 1)
          marker = '@media(max-width:680px){.wrap{'
          replacement = '@media(max-width:680px){.video-stage{aspect-ratio:auto;height:min(72vh,520px);max-height:520px}.wrap{'
          if marker not in s:
              raise SystemExit('mobile breakpoint pattern not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
          mkdir -p site/media
          cp assets/evidence/poco-f6-android16-v2.0.0-full-camera-test.mp4 site/media/
          cp assets/evidence/poco-f6-android16-v2.0.0-video-poster.jpg site/media/

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright outside repository
        run: npm install --prefix /tmp/proof-pw --no-save playwright@1.55.0

      - name: Start site
        run: |
          python -m http.server 8000 --directory site >/tmp/site-http.log 2>&1 &
          sleep 1

      - name: Verify layout in Google Chrome
        run: |
          NODE_PATH=/tmp/proof-pw/node_modules node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          (async () => {
            fs.mkdirSync('proof-audit-final', {recursive:true});
            const browser = await chromium.launch({channel:'chrome', headless:true});
            const page = await browser.newPage();
            const locales = ['/', '/pl/', '/uk/', '/de/', '/ru/'];
            const widths = [1440, 1024, 820, 680, 390, 360];
            for (const locale of locales) {
              for (const width of widths) {
                await page.setViewportSize({width, height:1000});
                await page.goto(`http://127.0.0.1:8000${locale}`, {waitUntil:'domcontentloaded'});
                await page.locator('.proof-section').scrollIntoViewIfNeeded();
                await page.waitForTimeout(750);
                const r = await page.evaluate(() => {
                  const stage = document.querySelector('.video-stage').getBoundingClientRect();
                  const video = document.querySelector('.evidence-video video');
                  const shots = [...document.querySelectorAll('.gallery .shot')];
                  return {
                    vw: document.documentElement.clientWidth,
                    sw: document.documentElement.scrollWidth,
                    stageW: stage.width,
                    stageH: stage.height,
                    ready: video.readyState,
                    duration: video.duration,
                    shotW: shots.map(x => Math.round(x.getBoundingClientRect().width)),
                    fits: shots.map(x => getComputedStyle(x.querySelector('img')).objectFit),
                    opacity: Number(getComputedStyle(document.querySelector('.proof-section .reveal')).opacity),
                  };
                });
                assert.ok(r.sw <= r.vw + 1, `${locale}@${width}: horizontal overflow`);
                assert.ok(r.stageW > 0 && r.stageH > 0, `${locale}@${width}: invalid video stage`);
                if (width > 680) {
                  const ratio = r.stageW / r.stageH;
                  assert.ok(ratio > 1.7 && ratio < 1.85, `${locale}@${width}: desktop player ratio ${ratio}`);
                } else {
                  assert.ok(r.stageH <= 521 && r.stageH >= 400, `${locale}@${width}: mobile player height ${r.stageH}`);
                }
                assert.ok(r.ready >= 1 && Number.isFinite(r.duration) && r.duration > 0, `${locale}@${width}: video metadata unavailable`);
                assert.ok(Math.max(...r.shotW) - Math.min(...r.shotW) <= 1, `${locale}@${width}: screenshot widths differ`);
                assert.ok(r.fits.every(x => x === 'contain'), `${locale}@${width}: screenshot cropping enabled`);
                assert.ok(r.opacity > .98, `${locale}@${width}: proof content not fully visible`);
              }
            }
            await page.setViewportSize({width:1440,height:1000});
            await page.goto('http://127.0.0.1:8000/', {waitUntil:'domcontentloaded'});
            await page.locator('.proof-section').scrollIntoViewIfNeeded();
            await page.waitForTimeout(900);
            await page.locator('.proof-section').screenshot({path:'proof-audit-final/proof-desktop.png'});
            await page.setViewportSize({width:390,height:844});
            await page.goto('http://127.0.0.1:8000/', {waitUntil:'domcontentloaded'});
            await page.locator('.proof-section').scrollIntoViewIfNeeded();
            await page.waitForTimeout(900);
            await page.locator('.proof-section').screenshot({path:'proof-audit-final/proof-mobile.png'});
            await browser.close();
            console.log('FINAL PROOF MEDIA BROWSER AUDIT OK');
          })().catch(e => {console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: proof-gallery-final-screenshots
          path: proof-audit-final/*.png

      - name: Commit verified CSS only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/styles.css
          git commit -m 'site: constrain portrait proof video player'
          git push origin HEAD:fix-proof-gallery-video
