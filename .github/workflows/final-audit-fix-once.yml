name: Final audit fix once

on:
  push:
    branches: [audit-layout-and-localization]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-layout-and-localization
      - name: Apply final audit fixes
        run: python tools/final_audit_fix_once.py
      - name: Verify site
        run: |
          python tools/verify_public_naming.py --post-rename
          git diff --check
      - name: Remove one-shot tooling
        run: |
          rm tools/final_audit_fix_once.py
          rm .github/workflows/final-audit-fix-once.yml
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "site: fix tablet navigation and final locale grammar"
          git push origin HEAD:audit-layout-and-localization
