name: Final locale polish once

on:
  push:
    branches: [audit-layout-and-localization]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-layout-and-localization
      - name: Apply final locale editorial pass
        run: python tools/final_locale_polish_once.py
      - name: Verify site invariants
        run: |
          python tools/verify_public_naming.py --post-rename
          git diff --check
      - name: Remove one-shot tooling
        run: |
          rm tools/final_locale_polish_once.py
          rm .github/workflows/final-locale-polish-once.yml
      - name: Commit polished copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "site: finish native-language editorial pass"
          git push origin HEAD:audit-layout-and-localization
