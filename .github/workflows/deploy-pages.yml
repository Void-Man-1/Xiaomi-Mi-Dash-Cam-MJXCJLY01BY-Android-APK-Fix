name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/app-icon.png'
      - 'assets/screenshots/**'
      - 'assets/evidence/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage site media
        run: |
          mkdir -p site/media/screenshots
          cp assets/app-icon.png site/media/app-icon.png
          cp assets/screenshots/poco-f6-v2.0.0-main.png site/media/screenshots/
          cp assets/screenshots/offline-account-redmi-android16.png site/media/screenshots/
          cp assets/screenshots/galaxy-s24-ultra-android14-add-camera.png site/media/screenshots/
          cp assets/evidence/poco-f6-android16-v2.0.0-full-camera-test.mp4 site/media/
          cp assets/evidence/poco-f6-android16-v2.0.0-video-poster.jpg site/media/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
